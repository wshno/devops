# Managed by .github/workflows/repo-settings.yml (one installation token per owner, so one file per
# owner). Settings defaults are the workflow inputs; per-repo overrides and the files each repo gets
# go here. file-sync opens ONE pull request per repo ("chore: sync repository standards") with the
# files from settings-sync/files/ (paths relative to base-path).
#
# Files: zizmor + poutine workflows and their configs and the targeted CODEOWNERS go to every public
# repo; stale/labeler only where they exist today (labeler needs the repo's own .github/labeler.yml);
# the generic "Create release" tag-and-release.yml where the tag push triggers the container
# workflow (skylens keeps its own for the optional Android build, wsh-rtl-sdr for "Publish release").
# ddnsadmin is private (free plan): no code scanning upload or code owners, so no scanners/CODEOWNERS.
# manifest-diff.yml goes to the repos with deploy/ (Kubernetes app repos); it reads their own
# .github/manifest-renders.txt.
# dependabot-auto-merge.yml goes to every repo with a CI build on PRs (not lanot or wsh-rtl-sdr); it
# needs DEVOPS_BOT_CLIENT_ID + APP_PRIVATE_KEY in the devops-bot environment there.
#
# dependabot-yml: the stack template from settings-sync/files/dependabot/ (built by
# settings-sync/dependabot/build.py), synced as .github/dependabot.yml in a PR of its own.
#
# dependabot-update-dotnet-lockfiles.yml goes to the .NET repos (packages.lock.json + locked restore).
# type-label.yml + release.yml go to every repo: PR title -> type label -> release notes group.
# Labels themselves come from settings-sync/labels.yml (sync-labels.py, applied directly).
#
# CodeQL default setup is turned OFF everywhere (code-scanning: false in the workflow); the scanners
# are zizmor, poutine (and Grype) uploading SARIF.
#
# Rulesets/environments (applied directly, not via PR):
#   rulesets/main-baseline.json   floor for the default branch: PR required (squash/rebase), code-owner
#                                 review (only bites on the CODEOWNERS paths), linear history, no
#                                 force-push/deletion; admins bypass. Added NEXT TO each repo's own
#                                 ruleset (status checks, code scanning stay there); the strictest rule
#                                 wins. Not on wsh-pve: its patch/changelog workflows push to main.
#                                 Also: review threads resolved; no high+ zizmor/poutine alerts.
#   rulesets/pr-build-required.json  `pr-build / pr-build` must pass; only repos whose CI is the
#                                 reusable pr-build (it always reports, also when it skips).
#   environments/devops-bot.yml   main-only environment for the DEVOPS_BOT_PRIVATE_KEY secret.
#   ddnsadmin gets neither: private on the free plan, no rulesets or environments.
#
# Deliberately NOT managed (settings changed by hand, never by an app with Administration: write):
#   hwinther/proxmox, hwinther/private-apps  GitOps repos: they decide what runs in the clusters
#   hwinther/reusable-workflows              every repo runs its code with their own credentials
base-path: './settings-sync/files/'
repos:
  - repo: hwinther/ClutterStock
    dependabot-yml: dependabot/dotnet-node.yml
    environments-file: &envbot environments/devops-bot.yml
    rulesets-file:
      - rulesets/main-baseline.json
      - rulesets/pr-build-required.json
    file-sync:
      - &zizmor
        name: zizmor workflow
        source: workflows/zizmor.yml
        target: .github/workflows/zizmor.yml
        group: repository standards
      - &zizmorcfg
        name: zizmor config
        source: zizmor-config.yml
        target: .github/zizmor.yml
        group: repository standards
      - &poutine
        name: poutine workflow
        source: workflows/poutine.yml
        target: .github/workflows/poutine.yml
        group: repository standards
      - &poutinecfg
        name: poutine config
        source: poutine-config.yml
        target: .poutine.yml
        group: repository standards
      - &codeowners
        name: CODEOWNERS
        source: CODEOWNERS
        target: .github/CODEOWNERS
        group: repository standards
      - &stale
        name: stale workflow
        source: workflows/stale.yml
        target: .github/workflows/stale.yml
        group: repository standards
      - &label
        name: labeler workflow
        source: workflows/label.yml
        target: .github/workflows/label.yml
        group: repository standards
      - &release
        name: Create release workflow
        source: workflows/tag-and-release.yml
        target: .github/workflows/tag-and-release.yml
        group: repository standards
      - &automerge
        name: Dependabot auto-merge workflow
        source: workflows/dependabot-auto-merge.yml
        target: .github/workflows/dependabot-auto-merge.yml
        group: repository standards
      - &mdiff
        name: Manifest diff workflow
        source: workflows/manifest-diff.yml
        target: .github/workflows/manifest-diff.yml
        group: repository standards
      - &typelabel
        name: Type label workflow
        source: workflows/type-label.yml
        target: .github/workflows/type-label.yml
        group: repository standards
      - &releasecfg
        name: Release notes config
        source: release.yml
        target: .github/release.yml
        group: repository standards
      - &lockfiles
        name: Dependabot lockfiles workflow
        source: workflows/dependabot-update-dotnet-lockfiles.yml
        target: .github/workflows/dependabot-update-dotnet-lockfiles.yml
        group: repository standards
  - repo: hwinther/skylens
    dependabot-yml: dependabot/skylens.yml
    environments-file: *envbot
    rulesets-file:
      - rulesets/main-baseline.json
      - rulesets/pr-build-required.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *stale
      - *label
      - *automerge
      - *mdiff
      - *typelabel
      - *releasecfg
      - *lockfiles
  - repo: hwinther/pbs-browser
    dependabot-yml: dependabot/dotnet-node.yml
    environments-file: *envbot
    rulesets-file:
      - rulesets/main-baseline.json
      - rulesets/pr-build-required.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *stale
      - *label
      - *release
      - *automerge
      - *mdiff
      # Private on the free plan: auto-merge, secret scanning and push protection aren't available
      # (the API answers 422), so they stay off here instead of failing every run.
      - *typelabel
      - *releasecfg
      - *lockfiles
  - repo: hwinther/ddnsadmin
    dependabot-yml: dependabot/python-node.yml
    allow-auto-merge: false
    secret-scanning: false
    secret-scanning-push-protection: false
    # No environments on a private free-plan repo, so the devops-bot key stays a repository secret
    # (DEVOPS_BOT_PRIVATE_KEY) here and the synced Create release / Dependabot auto-merge (which read
    # it from the devops-bot environment) aren't synced: its own copies stay as they are.
    file-sync:
      - *stale
      - *label
      - *mdiff
      - *typelabel
      - *releasecfg
  - repo: hwinther/test
    dependabot-yml: dependabot/dotnet-node.yml
    environments-file: *envbot
    rulesets-file:
      - rulesets/main-baseline.json
      - rulesets/pr-build-required.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *stale
      - *label
      - *release
      - *automerge
      - *mdiff
      - *typelabel
      - *releasecfg
      - *lockfiles
  - repo: hwinther/wsh-rtl-sdr
    dependabot-yml: dependabot/wsh-rtl-sdr.yml
    environments-file: *envbot
    rulesets-file: rulesets/main-baseline.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *mdiff
      - *typelabel
      - *releasecfg
  - repo: hwinther/wsh-pve
    dependabot-yml: dependabot/node.yml
    environments-file: *envbot
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *automerge
      - *typelabel
      - *releasecfg
  # VS Code extension: its own release.yaml publishes to the Marketplace and Open VSX on a bare
  # x.y.z tag and creates the GitHub release with generated notes, so no synced Create release.
  # No labeler/stale (no .github/labeler.yml; little traffic).
  - repo: hwinther/kubernetes-yaml-formatter
    dependabot-yml: dependabot/kubernetes-yaml-formatter.yml
    environments-file: *envbot
    rulesets-file:
      - rulesets/main-baseline.json
      - rulesets/pr-build-required.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *automerge
      - *typelabel
      - *releasecfg
  - repo: hwinther/lanot
    environments-file: *envbot
    rulesets-file: rulesets/main-baseline.json
    file-sync:
      - *zizmor
      - *zizmorcfg
      - *poutine
      - *poutinecfg
      - *codeowners
      - *typelabel
      - *releasecfg
