name: Repository report

# Hourly in the daytime: report/generate.py reads every repo in repos.yaml through the automation GitHub App and
# writes index.html + data.json. They ship as a ConfigMap in the signed OCI artifact
# ghcr.io/wshno/devops/report:latest, which the homelab cluster (hwinther/proxmox,
# clusters/production/apps/devops-report) reconciles with Flux and serves behind Authelia.
#
# Needs the repo variable AUTOMATION_APP_CLIENT_ID and secret AUTOMATION_APP_PRIVATE_KEY. The app is
# installed on both owners in repos.yaml; each owner gets its own read-only token.

on:
  schedule:
    # Hourly 06:17-20:17 UTC (07-21 Norwegian winter time, 08-22 summer time) and once at night,
    # 01:17. Off the hour, where GitHub delays scheduled runs the most. Read-only API calls; a run
    # takes about 3 minutes, so ~16 runs a day is ~50 Actions minutes (private repo).
    - cron: '17 6-20 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - 'repos.yaml'
      - '.github/workflows/report.yml'

permissions: {}

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app tokens below are limited to the repos the report reads (zizmor github-app).
      - name: Repositories per owner
        id: repos
        run: |
          set -euo pipefail
          for owner in hwinther wshno; do
            list=$(sed -nE "s|^ *- repo: ${owner}/([A-Za-z0-9._-]+) *$|\1|p" repos.yaml | paste -sd, -)
            echo "${owner}=${list}" >> "$GITHUB_OUTPUT"
          done

      - name: App token (hwinther)
        id: token-hwinther
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: hwinther
          repositories: ${{ steps.repos.outputs.hwinther }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-metadata: read

      - name: App token (wshno)
        id: token-wshno
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: wshno
          repositories: ${{ steps.repos.outputs.wshno }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-metadata: read

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Generate the report
        env:
          GITHUB_TOKEN_HWINTHER: ${{ steps.token-hwinther.outputs.token }}
          GITHUB_TOKEN_WSHNO: ${{ steps.token-wshno.outputs.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r report/requirements.txt
          python report/generate.py repos.yaml "$RUNNER_TEMP/report"
          python report/configmap.py "$RUNNER_TEMP/report" "$RUNNER_TEMP/artifact/report.yaml"

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0

      - name: Set up cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Push and sign
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ARTIFACT: ghcr.io/wshno/devops/report
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          pushed="$(flux push artifact "oci://${ARTIFACT}:latest" \
            --path="$RUNNER_TEMP/artifact" \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output=json)"
          digest="$(printf '%s' "$pushed" | jq -r '.digest')"
          cosign sign --yes "${ARTIFACT}@${digest}"
          {
            echo "### Repository report"
            echo
            echo "\`${ARTIFACT}:latest\` → \`${digest}\`, signed (cosign keyless)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report
          retention-days: 14
