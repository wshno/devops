name: Repository settings sync

# Applies one baseline of repository settings to the repos in settings-sync/repos-<owner>.yml, with
# joshjohanning/bulk-github-repo-settings-sync-action and the wshno-repo-settings GitHub App
# (Administration, Contents, Pull requests and Workflows: write).
#
# That App can change or remove rulesets and branch protection, so its key lives only in the
# `repo-settings` environment, which only main can deploy to (a private repo on the free plan can't
# have required reviewers), the workflow only runs by hand, and the GitOps repos (proxmox,
# private-apps) and reusable-workflows aren't managed or installed. By hand, dry-run is the default:
# read the job summary, then run again with dry_run off to apply. Daily, it applies: what is merged
# in wshno/devops (reviewed there) reaches the repos within a day, and the merge job then merges the
# sync PRs once their checks are green (the App is a bypass actor, pull_request mode, on "main
# baseline (synced)"; it can change rulesets anyway, so that adds no power).
#
# Needs, in the `repo-settings` environment: variable REPO_SETTINGS_CLIENT_ID and secret
# REPO_SETTINGS_PRIVATE_KEY. The App also needs Checks: read (the merge job reads the sync PRs' checks).

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would change'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: repo-settings
  cancel-in-progress: false

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        owner: [hwinther, wshno]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: repo-settings
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Limited to the repos listed for this owner (zizmor github-app).
      - name: Repositories for ${{ matrix.owner }}
        id: repos
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          list=$(sed -nE "s|^ *- repo: ${OWNER}/([A-Za-z0-9._-]+) *$|\1|p" "settings-sync/repos-${OWNER}.yml" | paste -sd, -)
          [ -n "$list" ] || { echo "::error::No repos for ${OWNER}"; exit 1; }
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Mint wshno-repo-settings token for ${{ matrix.owner }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-administration: write
          permission-contents: write
          permission-pull-requests: write
          # file-sync writes .github/workflows/*; without this the tree API answers 403.
          permission-workflows: write

      # Baseline. Settings not listed here stay as they are.
      # - Squash (titled from the PR: PR titles follow Conventional Commits, so main does too) and
      #   rebase; no merge commits.
      # - Auto-merge, delete merged branches, offer "Update branch".
      # - Secret scanning + push protection, Dependabot alerts + security updates.
      - name: Sync settings (${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'apply' }})
        uses: joshjohanning/bulk-github-repo-settings-sync-action@40134e844f292d0dcdc88c24fde06f085d191a35 # v2.12.4
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repositories-file: settings-sync/repos-${{ matrix.owner }}.yml
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          summary-heading: "Repository settings: ${{ matrix.owner }}${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' (dry run)' || '' }}"
          allow-squash-merge: true
          squash-merge-commit-title: PR_TITLE
          allow-merge-commit: false
          allow-rebase-merge: true
          allow-auto-merge: true
          delete-branch-on-merge: true
          allow-update-branch: true
          secret-scanning: true
          secret-scanning-push-protection: true
          dependabot-alerts: true
          dependabot-security-updates: true

      # The bulk action can't manage labels: settings-sync/labels.yml, created or updated (never
      # deleted) in the same repos with the same token (Pull requests: write covers labels).
      - name: Sync labels (${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'apply' }})
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ matrix.owner }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("$OWNER")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 -I settings-sync/sync-labels.py "${args[@]}"

  # Merges the sync PRs the run above opened or updated (and older ones still open) once every check
  # on them is green; pinned to the checked commit. Still running after 30 minutes: the next run.
  merge:
    needs: sync
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    strategy:
      fail-fast: false
      matrix:
        owner: [hwinther, wshno]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: repo-settings
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repositories for ${{ matrix.owner }}
        id: repos
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          list=$(sed -nE "s|^ *- repo: ${OWNER}/([A-Za-z0-9._-]+) *$|\1|p" "settings-sync/repos-${OWNER}.yml" | paste -sd, -)
          [ -n "$list" ] || { echo "::error::No repos for ${OWNER}"; exit 1; }
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Mint wshno-repo-settings token for ${{ matrix.owner }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          # The sync PRs change .github/workflows/*; merging them needs this too.
          permission-workflows: write

      - name: Merge green sync PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python3 -I settings-sync/merge-sync-prs.py "$OWNER" --wait-minutes 30
