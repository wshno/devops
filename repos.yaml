# Repositories in the daily report (report/generate.py). Order here is the order on the page.
#
#   repo      owner/name
#   kind      app (deployed; has images and e2e) or library (packages, workflows)
#   report    full (default): release, drift, PRs, frameworks and quality; prs: open PRs only
#   minimums  per-repo overrides of the minimums below

# Lowest accepted version per framework: below is red, at or above is green. Raise one when every
# repo should move (e.g. typescript to 7 once we're ready for it). `node` is read from
# package.json engines, .nvmrc/.node-version, Dockerfile `FROM node:N` and workflow node_version /
# node-version; `python` from pyproject.toml requires-python, .python-version, Dockerfile
# `FROM python:X.Y` and workflow python_version / python-version; `dotnet` from TargetFramework.
# Python and .NET are also red once endoflife.date's EOL date passes. Every other
# key is an npm package, matched in every package.json. A minimum compares as many parts as it
# has: "19" is a major, "0.88" a 0.x minor.
# Line coverage per file below this is flagged on the drill-down pages (and the per-component
# figure on the main page turns yellow below it, red 15 points under it).
coverage_threshold: 70

minimums:
  node: '26'
  python: '3.13'
  dotnet: '10'
  react: '19'
  typescript: '6'
  react-router: '8'
  vite: '8'
  expo: '58'
  react-native: '0.88'

repos:
  - repo: hwinther/ClutterStock
    kind: app
  - repo: hwinther/skylens
    kind: app
  - repo: hwinther/pbs-browser
    kind: app
  - repo: hwinther/ddnsadmin
    kind: app
  - repo: hwinther/test
    kind: app
  - repo: wshno/wshno
    kind: app
  - repo: wshno/romslig
    kind: app
  - repo: wshno/frontend-packages
    kind: library
  - repo: wshno/static-server
    kind: library
  - repo: hwinther/reusable-workflows
    kind: library

  # Open PRs only, in a table of their own.
  - repo: hwinther/proxmox
    kind: infra
    report: prs
  - repo: hwinther/private-apps
    kind: infra
    report: prs
  - repo: wshno/devops
    kind: infra
    report: prs
  - repo: hwinther/wsh-pve
    kind: other
    report: prs
  - repo: hwinther/wsh-rtl-sdr
    kind: other
    report: prs
  - repo: hwinther/kubernetes-yaml-formatter
    kind: other
    report: prs
  - repo: wshno/test-consumer
    kind: test
    report: prs
  - repo: wshno/test-ghcr
    kind: test
    report: prs
  - repo: wshno/test-npm
    kind: test
    report: prs
  - repo: wshno/test-nuget
    kind: test
    report: prs
  - repo: wshno/test-pypi
    kind: test
    report: prs
